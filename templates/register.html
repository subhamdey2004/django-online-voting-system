{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Register</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
        body
        {
            margin:0;
        }
        .navbar
        {
            background: linear-gradient(90deg,#F58220,#FFFFFF,#4DB848);
        }
        .bg-section
        {
            background-image:url("{% static 'images/voting-bg.jpg' %}");
            background-size:cover;
            background-position:center 25%;
            min-height:calc(100vh - 60px);
            display:flex;
            align-items:center;
            position:relative;
        }
        .bg-section::before
        {
            content:"";
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.35);
        }
        .bg-section > *
        {
            position:relative;
        }
        .quote
        {
            color:white;
            font-size:60px;
            font-weight:600;
            line-height:1.5;
            max-width:500px;
            text-shadow:2px 2px 15px rgba(0,0,0,0.6);
        }
        .form-box
        {
            background:rgba(255,255,255,0.2);
            backdrop-filter:blur(10px);
            padding:25px;
            border-radius:100px;
            border:rgba(255,255,255,0.2);
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
            width:350px;
            margin:25px;
            margin-right:-95px;
        }
        .custom-btn
        {
            background-color: #F58220;
            color:white ;
            border:none ;
            padding:8px 28px;
            border-radius:50px ;
            font-weight:600;
            transition:0.3s ease;
        }
        .custom-btn:hover
        {
            transform:scale(1.05);
        }
        .login-btn
        {
            background:#F58220;
            color:white;
            border:none;
        }
        </style>
        </head>
        <body>
            <nav class="navbar navbar-dark px-4">
                <span class="navbar-brand">eBallot Pro</span>
                <div>
                    <a href="{% url 'login' %}" class="btn login-btn btn-sm">Login</a>
                    <form action="{% url 'logout' %}" method="POST" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                </div>
            </nav>
            <div class="bg-section">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-md-6 quote">
                            " We should all vote for a stronger democracy "
                        </div>
                        <div class="col-md-6 d-flex justify-content-end pt-5">
                            <div class="form-box">
                                <h4 class="text-center mb-4">CREATE ACCOUNT</h4>
                                <form method="POST">
                                    {% csrf_token %}
                                    <div class="mb-3">
                                        <label>Username</label>
                                        <input type="text" name="username" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label>Password</label>
                                        <input type="password" name="password1" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label>Re Password</label>
                                        <input type="password" name="password2" class="form-control">
                                    </div>
                                    <div class="text-center">
                                        <button class="btn custom-btn">SUBMIT</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </body>
</html>
