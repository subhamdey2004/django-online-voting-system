<!DOCTYPE html>
<html>
    <head>
        <title>Online Voting</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
        <style>
        body
        {
            font-family:'Poppins',sans-serif;
            margin:0;
        }
        .navbar
        {
            background: linear-gradient(90deg,#F58220,#FFFFFF,#4DB848);
        }
        .navbar-brand
        {
            color:#FFFFFF!important;
            font-weight:600;
            font-size:20px;
        }
        .navbar-brand:hover
        {
            transform:scale(1.05);
            transition:0.3s;
        }
        .nav-btn{
            border-radius:10px;
            padding:6px 14px;
            font-weight:500;
        }
        .login-btn{
            background:white;
            color:#1d2671;
            border:none;
        }
        .login-btn:hover
        {
            background:#eee;
        }
        .register-btn
        {
            background:transparent;
            border:1px solid white;
            color:white;
        }
        .register-btn:hover{
            background:white;
            color:#1d2671;
        }
        .logout-btn
        {
            background:#ff4d4d;
            color:white;
            border:none;
        }
        .logout-btn:hover
        {
            background:#e60000;
        }
        </style>
        </head>
        <body>
            <nav class="navbar navbar-dark">
                <div class="container">
                    <a class="navbar-brand">eBallot Pro</a>
                    <div>
                        {% if user.is_authenticated %}
                        <form action="{% url 'logout' %}" method="POST" style="display:inline;">
                            {% csrf_token %}
                            <button class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                        {% else %}
                        <a href="{% url 'login' %}" class="btn nav-btn login-btn">Login</a>
                        <a href="{% url 'register' %}" class="btn nav-btn register-btn">Register</a>
                        {% endif %}
                    </div>
                </div>
            </nav>
            {% if messages %}
            <div class="container mt-3">
                {% for message in messages %}
                <div class="alert alert-warning">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% block content %}
            {% endblock %}
        </body>
</html>
